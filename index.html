<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="sr-only" href="#task-input">Skip to add task</a>

    <main class="app" role="main">
        <header class="app__header">
            <section aria-labelledby="app-title">
                <h1 class="app__title" id="app-title">My Task Manager</h1>
                <p class="app__subtitle">Add tasks, mark them done, and delete what you don’t need.</p>
            </section>

            <section class="app__stats" aria-label="Task statistics" aria-live="polite">
                <div class="stat" role="group" aria-label="Total tasks">
                    <div class="stat__label">Total</div>
                    <div class="stat__value" id="stat-total">0</div>
                </div>
                <div class="stat" role="group" aria-label="Completed tasks">
                    <div class="stat__label">Done</div>
                    <div class="stat__value" id="stat-done">0</div>
                </div>
            </section>
        </header>

        <section class="card" aria-label="Task input and list">
            <form id="task-form" class="task-form" autocomplete="off">
                <label class="sr-only" for="task-input">New task</label>
                <input
                    type="text"
                    id="task-input"
                    placeholder="What do you want to do today?"
                    maxlength="120"
                    inputmode="text"
                />
                <button type="submit" id="add-button">Add Task</button>
            </form>

            <div class="toolbar" role="group" aria-label="List actions">
                <button id="clear-button" class="btn btn--danger" type="button">Clear All</button>
            </div>

            <section aria-label="Tasks">
                <ul id="task-list" class="task-list"></ul>
                <div id="empty-state" class="empty" hidden>
                    <div class="empty__title">No tasks yet</div>
                    <div class="empty__hint">Add your first task using the input above.</div>
                </div>
            </section>
        </section>

        <footer class="sr-only" aria-hidden="true">Task Manager</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
